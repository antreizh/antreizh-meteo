
name: Antreizh - Collecte meteo

"on":
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: antreizh-collecte-meteo
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Actualiser les observations sur IONOS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --connect-timeout 10 \
            --max-time 110 \
            --retry 1 \
            --retry-delay 4 \
            --output /dev/null \
            'https://www.antreizh.fr/widgets/vent/wind-data.php'

          echo "Collecte demandee."
